[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "astel-video-editor"
version = "0.6.0"
description = "Astel AutoEditor: AI short-form editing engine with secure worker queue and feedback learning"
requires-python = ">=3.11"
dependencies = [
  "numpy>=2.0",
  "opencv-python-headless>=4.10",
  "openai>=1.68",
]

[project.optional-dependencies]
scenes = ["scenedetect>=0.7.1"]
api = [
  "fastapi>=0.116",
  "httpx>=0.28",
  "uvicorn[standard]>=0.35",
]
dev = [
  "pytest>=8.0",
]

[project.scripts]
video-editor = "video_editor.cli:main"
video-editor-api = "video_editor.api:run"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
