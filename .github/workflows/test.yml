name: tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,api]"
      - name: Compile
        run: python -m compileall -q src
      - name: Test
        run: pytest -q

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Remotion
        working-directory: remotion
        run: npm install
      - name: Typecheck Remotion
        working-directory: remotion
        run: npm run typecheck


  editor:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install AstelFam Editor
        working-directory: editor
        run: npm install
      - name: Build AstelFam Editor
        working-directory: editor
        run: npm run build
